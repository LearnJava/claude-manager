# Слой опыта (LEARN-TASKS.md, LN-01..18). Очередь — LEARN-STATUS.md:
# голые указатели LEARN-TASKS.md:NN, одна задача = одна сессия, файл
# опустел -> цикл останавливается. bypassPermissions потому, что это
# автономный auto_restart-цикл: спросить разрешение не у кого.
[[session]]
  name = "Программист 1"
  prompt = "Прочитай CLAUDE.md и LEARN-TASKS.md. Следуй разделу «Как сессия берёт задачу»: если в таблице Status есть задача ● IN PROGRESS — продолжай ЕЁ; иначе возьми ВЕРХНИЙ указатель из LEARN-STATUS.md, все зависимости которого уже ✓ DONE, и отметь её ● IN PROGRESS. Выполняй строго по спецификации задачи в LEARN-TASKS.md, включая раздел «Готово когда» — каждая функция сопровождается тестом. Соблюдай раздел «Инварианты» (в частности: всё новое выключено по умолчанию, при выключенных флагах промпт сессии обязан остаться байт-в-байт прежним, ничего не пишется в репозиторий пользователя без аппрува в UI). Завершение только при зелёных `go build ./...` и `go test ./...` (и `npm --prefix frontend test`, если менялся фронтенд): удали строку-указатель из LEARN-STATUS.md, переведи задачу в ✓ DONE с датой, обнови документацию по матрице doc-sync из CLAUDE.md, закоммить. Одна задача = одна сессия, следующую не бери."
  auto_restart = true
  max_tasks = 0
  stop_when_no_tasks = true
  task_source = "LEARN-STATUS.md"
  model = "sonnet"
  fallback_model = ""
  fallback_model_on_rate_limit = false
  effort = "high"
  permission_mode = "bypassPermissions"
  max_budget_usd = 0.0
  use_worktree = true
  worktree_name = ""
  system_prompt_append = ""
  preflight = "auto"
  pre_task_hook = ""
  post_task_hook = ""
  crash_recovery_prompt = ""
