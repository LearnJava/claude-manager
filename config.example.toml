# Claude Session Manager — example configuration
# Copy to ~/.claude-manager/config.toml and edit to suit your projects.

[settings]
claude_path = "claude"                  # path to CLI; "claude" if it's in PATH
hermes_path = "hermes"                  # Hermes CLI, used by sessions with runtime = "hermes"
default_retry_delay = 30               # seconds between retries on error
rate_limit_pause = 300                 # seconds to pause when rate-limited
log_retention_days = 30                # days to keep session history in SQLite
theme = "dark"                         # dark | light
language = "en"                        # en | ru — UI language only, prompts to Claude stay English

# Crash recovery: persist session_id to ~/.claude-manager/state/ before each
# task so an interrupted session can be resumed via --resume after a restart.
# Equivalent to the orchestrator.py session state files (.session-PN.json).
# Use ClearSessionState() / the UI button to force a fresh start (--new).
crash_recovery = true

# Pre-flight analysis (runs a haiku analyst on the session's prompt before a
# start from the UI; only for sessions with a prompt and no task queue)
preflight_analysis = true
preflight_model = "haiku"
preflight_max_budget = 0               # 0 = no limit, >0 = USD cap
preflight_auto_approve_single = true   # skip review dialog when plan has one session

# Permission handling
permission_notify_after = 30           # seconds before escalating notification
permission_timeout = 0                 # 0 = wait forever; >0 = timeout in seconds
permission_timeout_action = "deny"     # deny (auto-deny) | pause_session (stop the session, resumable)
permission_native_notification = true  # Windows toast when minimised
permission_sound = true                # audible alert on permission request

# Budget alerts (0 = disabled)
daily_budget_alert = 0                 # notify if daily spend exceeds this USD
weekly_budget_alert = 0                # notify if weekly spend exceeds this USD
rate_limit_alert_threshold = 0.80      # notify when rate-limit utilisation > 80%

# [optimization] — launch tuning (defaults shown):
# exclude_dynamic_system_prompt = true  # --exclude-dynamic-system-prompt-sections (better prompt-cache hits)
# max_turns_auto_adjust = true          # --max-turns = 1.6 × longest recent run, after 5 finished runs
# max_turns_default = 50                # floor for that cap

# UTF-8 for Python run by the agent: PYTHONUTF8=1 and PYTHONIOENCODING=utf-8 in
# every Claude session's environment (a value already set is kept). Without it
# Python prints in the console code page and Russian text comes back unreadable
# (8.6% of Python runs in Lumen's sessions, docs/Science_lab/MEASURE.md).
python_utf8 = true

# Project mirror (Settings → Projects → "Mirror into Claude Manager"): projects
# with mirror = true get a local copy of their settings (CLAUDE.md, .claude/,
# .claude-manager/, task queues) and saved logs, committed to a local git
# repository with no remote. Empty mirror_dir = <claude-manager checkout>/projects
# when the app runs from its build/bin, else ~/.claude-manager/projects.
# mirror_dir = ''
mirror_interval_min = 15                 # re-sync period; 0 = only on start/save/button

# ─── Mixed-programming workers (MIXED-TASKS.md) ──────────────────────────────
# External OpenAI-compatible models that write code as FIND/REPLACE patches.
# The manager applies patches in a worktree, runs the project gates and returns
# failures as feedback (max mixed_max_rounds). API keys are read from the env
# var named in key_env — never stored in this file. Free endpoints log requests:
# enable mixed_programming per project only for code that may leave the machine.
# The two workers below match config.WorkerPresets() (lumen bench 2026-07-02).

[[worker]]
name = "step37"                          # role "hands": fast, precise on strict briefs
base_url = "https://api.kilo.ai/api/gateway"
model = "stepfun/step-3.7-flash:free"
key_env = "KILO_API_KEY"
role = "hands"
reasoning_effort = "low"                 # default; anything higher burns tokens on thinking
max_output_tokens = 16000                # gateway truncates past this; manager auto-continues
continuation_cap = 3                     # max finish_reason=length continuations
request_timeout_sec = 180

[[worker]]
name = "nemotron-ultra"                  # role "quality": honest feedback cycle
base_url = "https://api.kilo.ai/api/gateway"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
key_env = "KILO_API_KEY"
role = "quality"
ascii_anchors_only = true                # Cyrillic in FIND anchors is unsafe for nemotron

# ─── Project 1 ────────────────────────────────────────────────────────────────

[[project]]
name = "lumen-browser"
path = 'D:\RustProjects\lumen-browser'

# Mixed programming: explicit privacy opt-in per project. Requires gates —
# blocking check commands run after worker patches (model tests are untrusted).
# mixed_programming = true
# gates = ["cargo check", "cargo clippy --all-targets -- -D warnings", "cargo test"]
# mixed_max_rounds = 3                   # feedback rounds before needs-human

# Project journal (LEARN-TASKS.md LN-06): episodic memory between sessions —
# one short distilled entry per completed task, appended to
# <project>/.claude-manager/journal.md via a cheap haiku call. Private layer
# opt-in like mixed_programming above. journal.md is gitignored unless
# journal_commit = true.
# journal = true
# journal_commit = false

# Skill autopilot (LEARN-TASKS.md LN-25..27): after finished runs the manager
# distills recurring patterns into skills, has a second model review them,
# writes accepted ones to <project>/.claude/skills/ on trial, and after 10
# runs keeps those agents actually load / switches off the rest (moved to
# .claude-manager/archived-skills/, restorable from the Skills tab). Private
# layer: it spends money and writes into the repository. Needs
# [optimization] experience_tracking (the UI switch turns it on too).
# auto_skills = true
# auto_skills_daily_budget_usd = 0       # 0 = no cap

# Keep a local copy of this project in the manager's mirror folder (see
# mirror_dir above). Manager-side flag: stays in this global file, never in
# the project folder. Set by the Settings button.
# mirror = true

# Seeds permission_mode for sessions newly added to this project from now on
# (empty = built-in default, bypassPermissions). Never touches an existing
# session's already-saved permission_mode.
# default_permission_mode = "bypassPermissions"

  [[project.session]]
  name = "P1"
  prompt = """
  You are developer P1. Read STATUS-P1.md — it contains bare pointer lines
  `<source>:NN` (one open task per line, priority top-down). Continue the task
  marked in progress in the master list, otherwise take the topmost pointer.
  When the task is done, call /lumen-task-finish and remove its pointer line.
  """
  auto_restart = true
  max_tasks = 0                        # 0 = no limit
  stop_when_no_tasks = true
  task_source = "STATUS-P1.md"         # pointer lines `<source>:NN` (canonical)
                                       #   or legacy In progress/Next sections

  # Model and performance
  model = "sonnet"                     # opus | sonnet | haiku | full model id
  fallback_model = ""                  # fallback model when rate-limited or overloaded
  fallback_model_on_rate_limit = false # true: switch to fallback_model immediately on
                                       #   rate limit and restart without waiting 5 min
                                       #   (mirrors orchestrator.py fallback behaviour)
  effort = "high"                      # low | medium | high | xhigh | max

  # Permissions
  permission_mode = "acceptEdits"      # default | acceptEdits | auto | plan | dontAsk | bypassPermissions
  # allowed_tools patterns are "ToolName(prefix:*)" — a trailing ":*" matches
  # any command starting with that prefix. Verified live 2026-07-24: under
  # acceptEdits, unlisted Bash commands (even harmless ones like `go version`
  # or `git add`) are silently auto-denied with no prompt ever reaching this
  # app in unattended/auto_restart sessions — nobody is there to approve them,
  # so the run just wastes tokens and stalls. With permission_mode =
  # bypassPermissions (the default for new sessions — see
  # default_permission_mode below) allowed_tools is unnecessary; only use it
  # when you deliberately picked a stricter mode for a specific project.
  # Common per-toolchain examples (adjust to what the project actually runs):
  #   Go:      ["Bash(go:*)", "Bash(gofmt:*)"]
  #   Node:    ["Bash(npm:*)", "Bash(node:*)"]
  #   Rust:    ["Bash(cargo:*)"]
  #   Python:  ["Bash(python:*)", "Bash(pip:*)", "Bash(pytest:*)"]
  allowed_tools = ["Bash(cargo:*)", "Bash(npm:*)"]
  disallowed_tools = ["Bash(rm -rf *)"]

  # Budget (0 = no limit)
  max_budget_usd = 0

  # Worktree
  use_worktree = true
  # Optional stable worktree/branch name passed to `--worktree <name>`. Leave
  # empty (default) to let the CLI create a FRESH worktree from HEAD on every run
  # — required for the autonomous restart loop. Set a name only for a long-lived,
  # manually-managed worktree (note: a fixed name reuses an existing worktree,
  # which can go stale relative to the main repo).
  worktree_name = ""

  # Additional context
  system_prompt_append = ""
  add_dirs = []

  # Pre-flight override (always | auto | never)
  preflight = "auto"

  # Hooks (shell commands run before/after each task)
  pre_task_hook = ""
  post_task_hook = ""

  # Crash recovery prompt: message sent to Claude when resuming an interrupted
  # session via --resume. Leave empty to use the built-in English default.
  # crash_recovery_prompt = "Сессия была прервана. Проверь git status и STATUS-P1.md, продолжи задачу."

  # Context primer (LEARN-TASKS.md LN-05): prepend an auto-generated "Project
  # state" block (current task, git state, files the previous run touched,
  # gate commands) to a fresh run's initial prompt, capped at ~2000 chars.
  # Off by default.
  context_primer = false

  # Context handoff (LEARN-TASKS.md LN-15): when this session's context usage
  # crosses optimization.context_restart_threshold (global setting, default
  # 0.75), send a compact distilled recap as the first user turn of the
  # fresh process instead of --resume-ing the full (expensive) conversation
  # history. Off by default; crash recovery is unaffected — it always still
  # uses --resume.
  # What happens at the threshold is optimization.context_restart_mode:
  #   "fresh"  — new process with the recap (above);
  #   "resume" — keep the process, send /compact (the CLI summarizes in place);
  #   "ask"    — ask in the UI: compact / restart with a recap / continue;
  #   "off"    — nothing.
  # Autonomous sessions always use "fresh".
  context_handoff = false

  # Ask-user marker in interactive sessions: teach the model the ```ask-user
  # JSON block in the system prompt. A marker is shown as a question with
  # option buttons (no timeout — you are there) either way; this flag only
  # adds the schema so the model writes it reliably. Autonomous sessions
  # always have it. Off by default; with it false the prompt is unchanged.
  ask_user_marker = false

  # Handoff by context budget (autonomous Claude sessions): once a model call
  # sends at least this many context tokens, the manager tells the agent
  # mid-turn to finish its step, commit work in progress with a handoff note
  # and end the turn on the done marker; a fresh session continues the task
  # with a small context. Every call re-reads the whole conversation, so long
  # sessions cost disproportionately: in Lumen, sessions over 100 calls were
  # 23% of sessions and 56% of spend (docs/Science_lab/MEASURE.md). In Lumen
  # 150000 is reached by a third of sessions, at about their 78th call;
  # 120000 by more than half, at about the 56th. 0 = off (prompt unchanged).
  handoff_context_tokens = 0

  # Runtime (HERMES-TASKS.md): "claude" (default) or "hermes". A hermes
  # session runs `hermes chat --query-file - --format stream-json`, one
  # process per turn, resuming the conversation by id. `model` is then any
  # provider model id (e.g. "anthropic/claude-sonnet-4.6"); `effort` maps to
  # --reasoning. Claude models via Hermes are billed as API/extra usage, not
  # from the Claude subscription. Ignored under hermes: max_budget_usd,
  # fallback_model, allowed/disallowed_tools, add_dirs; any permission_mode
  # other than bypassPermissions (= --yolo) follows Hermes' own approvals.
  # runtime = "hermes"
  # hermes_provider = "openrouter"         # --provider; empty = Hermes default
  # hermes_profile = "cm-lumen"            # -p <profile>: own memory/skills/hooks
  # hermes_skills = ["my-skill"]           # -s, preloaded every turn
  # hermes_max_turns = 500                 # --max-turns per turn; 0 = 500, not Hermes' own agent.max_turns

  # Auto-approve rules evaluated in order; first match wins
  [[project.session.permission_rule]]
  tool = "Bash"
  pattern = "cargo *"
  decision = "allow"

  [[project.session.permission_rule]]
  tool = "Edit"
  pattern = "*"
  decision = "allow"

  [[project.session.permission_rule]]
  tool = "Bash"
  pattern = "rm *"
  decision = "deny"

  [[project.session]]
  name = "P2"
  prompt = "You are developer P2. Read STATUS-P2.md and continue the next task."
  auto_restart = true
  permission_mode = "bypassPermissions"

  [[project.session]]
  name = "P3"
  prompt = "You are developer P3. Read STATUS-P3.md and continue the next task."
  auto_restart = true
  permission_mode = "bypassPermissions"

# ─── Project 2 ────────────────────────────────────────────────────────────────

[[project]]
name = "my-api"
path = 'D:\Projects\my-api'

  [[project.session]]
  name = "backend"
  prompt = "Work on the next backend task from TODO.md."
  auto_restart = false
  model = "sonnet"
  permission_mode = "acceptEdits"

  [[project.session]]
  name = "frontend"
  prompt = "Work on the next frontend task from TODO.md."
  auto_restart = false
  model = "sonnet"
  permission_mode = "acceptEdits"
