[[project]]
name = "lumen"
path = "."

[[project.session]]
name = "P1"
prompt = "Please refactor this code"
auto_restart = false
model = "claude-sonnet-4-6"
# Explicit: this scenario exercises the pending-permission/RespondPermission
# flow, which bypassPermissions (the default for an unset permission_mode)
# auto-allows immediately, never queuing anything to respond to.
permission_mode = "acceptEdits"
